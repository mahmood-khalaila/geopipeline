apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: geopipeline
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mahmood-khalaila/geopipeline
    targetRevision: main
    path: geopipeline-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated: {}





